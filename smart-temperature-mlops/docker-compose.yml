services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped


  opcua-server:
    build:
      context: .
      dockerfile: Dockerfile.opcua
    ports:
      - "${OPCUA_HOST_PORT}:4840"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('localhost',4840),2); s.close()\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped


  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      OPCUA_ENDPOINT: ${OPCUA_ENDPOINT}
      OPCUA_NODE_ID: ${OPCUA_NODE_ID}
    depends_on:
      postgres:
        condition: service_healthy
      opcua-server:
        condition: service_healthy
    restart: unless-stopped


  trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      MODEL_PATH: ${MODEL_PATH}
      REFERENCE_PATH: ${REFERENCE_PATH}
    volumes:
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - ml.train


  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      MODEL_PATH: ${MODEL_PATH}
    volumes:
      - ./models:/app/models
    ports:
      - "${API_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped


  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      REFERENCE_PATH: ${REFERENCE_PATH}
      DRIFT_WINDOW: ${DRIFT_WINDOW}
      DRIFT_P_VALUE: ${DRIFT_P_VALUE}
      RETRAIN_COOLDOWN_SECONDS: ${RETRAIN_COOLDOWN_SECONDS}
    volumes:
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "${PROMETHEUS_HOST_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
      - monitor
    restart: unless-stopped


  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "${GRAFANA_HOST_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped


volumes:
  pgdata:
  grafanadata: