services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODEL_PATH: ${MODEL_PATH}

    ports:
      - "${BACKEND_HOST_PORT}:8000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend/ml:/app/ml


  simulator:
    build:
      context: ./simulator

    depends_on:
      - backend


  frontend:
    build:
      context: ./frontend

    ports:
      - "${FRONTEND_HOST_PORT}:5173"

    depends_on:
      - backend


volumes:
  postgres_data: