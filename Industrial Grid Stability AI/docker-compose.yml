services:
  postgres:
    image: postgres:17
    container_name: industrial-grid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gridai
      POSTGRES_USER: griduser
      POSTGRES_PASSWORD: gridpassword
    ports: ['5439:5432']
    volumes: [grid_postgres_data:/var/lib/postgresql/data, ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro]
    healthcheck: {test: ['CMD-SHELL','pg_isready -U griduser -d gridai'], interval: 5s, timeout: 5s, retries: 10}
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    container_name: industrial-grid-api
    environment:
      POSTGRES_DB: gridai
      POSTGRES_USER: griduser
      POSTGRES_PASSWORD: gridpassword
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      STABILITY_MODEL_PATH: /app/ml/models/stability_model.joblib
      ANOMALY_MODEL_PATH: /app/ml/models/anomaly_model.joblib
    ports: ['8005:8005']
    depends_on: {postgres: {condition: service_healthy}}
  prometheus:
    image: prom/prometheus:latest
    container_name: industrial-grid-prometheus
    ports: ['9090:9090']
    volumes: ['./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    depends_on: [api]
  grafana:
    image: grafana/grafana:latest
    container_name: industrial-grid-grafana
    ports: ['3002:3000']
    environment: {GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: admin}
    volumes: [grafana_data:/var/lib/grafana, ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro, ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro]
    depends_on: [prometheus]
volumes:
  grid_postgres_data:
  grafana_data:
